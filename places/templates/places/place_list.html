{% extends "base.html" %}

{% block title %}Места{% endblock %}

{% block content %}
<h1 class="mb-4 fw-bold">Городские места</h1>
<p class="text-muted">Всего мест: {{ places|length }}</p>

<div class="row">
    {% for place in places %}
        {% include "places/includes/place_card.html" %}
    {% empty %}
        <div class="col-12">
            <div class="card shadow-sm border-0 p-4 text-muted">
                Пока нет добавленных мест.
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
